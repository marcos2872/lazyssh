[package]
name = "lazyssh"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
ratatui = "0.29"
crossterm = "0.28"
russh = "0.50.0-beta.7"
russh-keys = "0.50.0-beta.7"
russh-sftp = "2.1.2"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
ring = "0.17"
pbkdf2 = "0.12"
rand = "0.8"
anyhow = "1"
dirs = "5"
fuzzy-matcher = "0.3"
shellexpand = "3"
arboard = "3"
tachyonfx = "0.25"
uuid = { version = "1.23.4", features = ["v4"] }
chrono = "0.4"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
